<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Юбилеят на Георги</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Анимирана покана за юбилей">
<meta name="theme-color" content="#070504">
<script>
/* ===================================================================
   НАСТРОЙКИ НА ПОКАНАТА — сменете стойностите в кавичките.
   Всичко останало (дати, дни от седмицата, календар, карта)
   се изчислява автоматично от тези данни.
   =================================================================== */
window.CONFIG = {
  name: "Георги",                 // име на юбиляря (заглавие и подпис)
  age: 60,                        // навършени години
  date: "2026-12-12",             // дата на празника: ГГГГ-ММ-ДД
  time: "19:00",                  // начален час
  venueType: "ресторант",         // ресторант, механа, хотел, дом…
  venue: "Старата къща",          // име на заведението (без кавички)
  address: "ул. „Примерна“ № 1, гр. София",
  mapQuery: "",                   // по желание: точен адрес за Google Maps
  rsvpDate: "2026-12-01",         // потвърждение до: ГГГГ-ММ-ДД
  phone: "0888 123 456",          // телефон за потвърждение
  greeting: "Скъпи приятели,",
  message: "За мен ще бъде голяма радост и чест да ви посрещна в кръга на най-близките си хора и заедно да отпразнуваме моя {age}-годишен юбилей!",
  highlight: "{age}-годишен юбилей",   // тази част от текста е в злато
  closingTitle: "Очаквам Ви!",
  closingText: "Нека заедно превърнем тази вечер в незабравим спомен!",
  palette: "gold",                // gold (черно-златно) | navy (синьо) | bordo (бордо) | emerald (зелено)
  hours: 6,                       // продължителност на празника (за календара)
  timeZone: "Europe/Sofia"
};
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Great+Vibes&family=Playfair+Display:ital,wght@0,400;0,500;1,400&display=swap">
<style>
/* Layout: full-bleed dark stage; every scene is one centred column sized in --u (1/100 of the design column) */
:root{
  color-scheme:dark;
  --ink:#070504;
  --ink-2:#1a120a;
  --ink-3:#2b1e10;
  --gold-deep:#8a6524;
  --gold:#d2ad5b;
  --gold-hi:#fbeec4;
  --champagne:#efe2bf;
  --muted:#b9a57c;
  --line:rgba(214,178,98,.5);
  --line-soft:rgba(214,178,98,.22);
  --glow:255,208,120;
  --f-script:"Great Vibes","Segoe Script","Apple Chancery","URW Chancery L",cursive;
  --f-num:"Playfair Display","Bodoni 72",Didot,Georgia,serif;
  --f-text:"Cormorant Garamond",Cormorant,Garamond,"Palatino Linotype",Palatino,"Times New Roman",serif;
  --gold-grad:linear-gradient(100deg,#a77b2c 0%,#d9b764 12%,#fdf1c8 24%,#c8973f 38%,#f3dc98 52%,#b4862f 66%,#f7e6b0 80%,#a77b2c 100%);
  --u:min(1vw,.85vh);
  --hud-top:calc(env(safe-area-inset-top,0px) + 54px);
  --hud-bottom:calc(env(safe-area-inset-bottom,0px) + 52px);
}
@supports (height:1dvh){:root{--u:min(1vw,.85dvh)}}
@media (min-aspect-ratio:5/4){
  :root{--u:min(1vw,.75vh)}
  @supports (height:1dvh){:root{--u:min(1vw,.75dvh)}}
}
:root[data-palette="navy"]{--ink:#03060f;--ink-2:#0b1932;--ink-3:#15294d}
:root[data-palette="bordo"]{--ink:#0a0204;--ink-2:#2a0911;--ink-3:#46111f}
:root[data-palette="emerald"]{--ink:#020806;--ink-2:#0a281e;--ink-3:#123e2f}

*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--ink);color:var(--champagne);font-family:var(--f-text);overflow:hidden;overscroll-behavior:none;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;text-size-adjust:100%}
[hidden]{display:none!important}
button{font:inherit;color:inherit}
p,h1,h2,ul{margin:0}
:focus-visible{outline:2px solid var(--gold-hi);outline-offset:3px}

#app{position:fixed;inset:0;overflow:hidden;isolation:isolate;touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
.bg{position:absolute;inset:0;z-index:0;background:radial-gradient(130% 95% at 50% 42%,var(--ink-3) 0%,var(--ink-2) 30%,var(--ink) 70%,#000 100%)}
.bg::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse 85% 75% at 50% 50%,transparent 55%,rgba(0,0,0,.6) 100%)}
.fx{position:absolute;inset:0;width:100%;height:100%;display:block;pointer-events:none}
#fx-back{z-index:1}
#fx-front{z-index:5}

/* ---------- gold type ---------- */
.gold{background-image:var(--gold-grad);background-size:6em 100%;background-repeat:repeat;-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}
.sheen{animation:sheen 9s linear infinite}
@keyframes sheen{to{background-position:-6em 0}}
.glow{filter:drop-shadow(0 0 .14em rgba(var(--glow),.32))}
.eyebrow{font:600 max(11px,calc(3.3*var(--u)))/1.25 var(--f-text);letter-spacing:.42em;padding-left:.42em;text-transform:uppercase;color:var(--gold)}
.script{font-family:var(--f-script);font-weight:400;line-height:1.18}
.serif-it{font-family:var(--f-text);font-style:italic;font-weight:500}
.ico{width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* ---------- HUD ---------- */
.hud{position:absolute;z-index:8;top:0;left:0;right:0;display:flex;align-items:center;gap:10px;padding-top:calc(env(safe-area-inset-top,0px) + 9px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));pointer-events:none;transition:opacity .6s ease}
.hud::before{content:"";position:absolute;inset:0 0 -24px;z-index:-1;background:linear-gradient(rgba(0,0,0,.45),transparent);pointer-events:none}
.bars{flex:1;display:flex;gap:5px;min-width:0;transition:opacity .6s ease}
.bar{flex:1;height:2px;border-radius:2px;background:rgba(239,226,191,.2);overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--gold-hi));transform-origin:0 50%;transform:scaleX(var(--p,0))}
.ibtn{pointer-events:auto;flex:none;width:36px;height:36px;display:grid;place-items:center;padding:0;border-radius:50%;border:1px solid var(--line);background:rgba(8,6,4,.55);color:var(--gold-hi);cursor:pointer;transition:background .3s ease,border-color .3s ease}
.ibtn:hover{background:rgba(48,36,18,.8);border-color:var(--gold)}
.ibtn .ico{width:18px;height:18px}
.ibtn .off,.ibtn.muted .on{display:none}
.ibtn.muted .off{display:block}
.skip{position:absolute;z-index:8;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 10px);transform:translateX(-50%);display:inline-flex;align-items:center;gap:6px;padding:8px 12px 8px 18px;border:1px solid var(--line-soft);border-radius:999px;background:rgba(8,6,4,.45);color:var(--muted);font:600 12px/1 var(--f-text);letter-spacing:.24em;text-transform:uppercase;cursor:pointer;transition:opacity .6s ease,color .3s ease,border-color .3s ease}
.skip:hover{color:var(--gold-hi);border-color:var(--line)}
.skip .ico{width:14px;height:14px}
#app.is-intro .hud,#app.is-intro .skip,#app[data-scene="card"] .skip{opacity:0;pointer-events:none}
#app.is-intro .hud *,#app[data-scene="card"] .skip{pointer-events:none}
#app[data-scene="card"] .bars{opacity:0}
.tz{position:absolute;z-index:6;top:0;bottom:0;margin:0;padding:0;border:0;background:transparent;cursor:pointer}
.tz-prev{left:0;width:30%}
.tz-next{right:0;width:70%}
#app.is-intro .tz,#app[data-scene="card"] .tz{display:none}
.toast{position:absolute;z-index:9;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 22px);max-width:calc(100% - 32px);transform:translate(-50%,16px);opacity:0;padding:10px 18px;border:1px solid var(--line);border-radius:999px;background:rgba(14,10,6,.94);color:var(--champagne);font:500 16px/1.25 var(--f-text);text-align:center;pointer-events:none;transition:opacity .35s ease,transform .35s ease}
.toast.show{opacity:1;transform:translate(-50%,0)}
.flash{position:absolute;inset:0;z-index:11;pointer-events:none;opacity:0;background:radial-gradient(circle at 50% 45%,rgba(255,244,214,.95),rgba(255,214,130,.4) 32%,transparent 70%)}
#app.flashing .flash{animation:flash 1.3s ease both}
@keyframes flash{0%{opacity:0}35%{opacity:1}100%{opacity:0}}

/* ---------- intro: sealed envelope ---------- */
#intro{position:absolute;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:calc(5*var(--u));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:calc(env(safe-area-inset-top,0px) + 20px) calc(env(safe-area-inset-bottom,0px) + 20px);text-align:center}
.intro-eyebrow{font-size:max(12px,calc(3.4*var(--u)));animation:fadeUp 1.2s cubic-bezier(.2,.7,.2,1) .1s both}
.intro-bottom{display:flex;flex-direction:column;align-items:center;gap:calc(2.2*var(--u));animation:fadeUp 1.2s cubic-bezier(.2,.7,.2,1) .5s both}
.intro-hint{font:italic 500 max(16px,calc(4.8*var(--u)))/1.3 var(--f-text);color:var(--champagne)}
.intro-sound{display:inline-flex;align-items:center;gap:.6em;font:600 max(11px,calc(2.8*var(--u)))/1 var(--f-text);letter-spacing:.3em;padding-left:.3em;text-transform:uppercase;color:var(--muted)}
.intro-sound .ico{width:1.5em;height:1.5em}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes fadeOut{to{opacity:0;transform:translateY(8px)}}

.env-float{animation:envFloat 5s ease-in-out infinite alternate}
@keyframes envFloat{from{transform:translateY(calc(-.8*var(--u)))}to{transform:translateY(calc(.8*var(--u)))}}
.env{position:relative;width:calc(80*var(--u));max-width:100%;aspect-ratio:3/2;perspective:calc(260*var(--u));cursor:pointer;animation:fadeUp 1.2s cubic-bezier(.2,.7,.2,1) .25s both}
.env-back{position:absolute;inset:0;z-index:1;border-radius:calc(1.2*var(--u));background:repeating-linear-gradient(45deg,rgba(214,178,98,.15) 0 1px,transparent 1px 9px),repeating-linear-gradient(-45deg,rgba(214,178,98,.15) 0 1px,transparent 1px 9px),linear-gradient(#22190e,#0d0a06);box-shadow:0 calc(3*var(--u)) calc(9*var(--u)) rgba(0,0,0,.7),0 0 0 1px rgba(214,178,98,.28)}
.env-card{position:absolute;z-index:2;left:7%;right:7%;top:6%;height:88%;display:flex;flex-direction:column;align-items:center;padding-top:7%;gap:3%;border-radius:calc(.7*var(--u));background:linear-gradient(160deg,#fcf6e6,#f0e2bf 60%,#e2cd9c);box-shadow:inset 0 0 0 1px rgba(150,110,40,.35),0 calc(1*var(--u)) calc(3*var(--u)) rgba(0,0,0,.35)}
.env-card::before{content:"";position:absolute;inset:calc(1.6*var(--u));border:1px solid rgba(160,120,50,.45);border-radius:calc(.4*var(--u))}
.ec-script{font:400 calc(11*var(--u))/1.1 var(--f-script);color:#94691d}
.ec-small{font:600 calc(2.5*var(--u))/1 var(--f-text);letter-spacing:.38em;padding-left:.38em;text-transform:uppercase;color:#86662a}
.env-front{position:absolute;inset:0;z-index:3;border-radius:calc(1.2*var(--u));clip-path:polygon(0 0,50% 54%,100% 0,100% 100%,0 100%);background:linear-gradient(170deg,#21180e 0%,#130e08 55%,#0b0805 100%)}
.env-front svg,.flap-out svg{position:absolute;inset:0;width:100%;height:100%}
.env-front line,.env-front polyline,.flap-out polyline{fill:none;stroke:rgba(214,178,98,.55);stroke-width:1;vector-effect:non-scaling-stroke}
.flap-out polyline{stroke-width:2}
.env-flap{position:absolute;inset:0;z-index:4;transform-origin:50% 0;transform-style:preserve-3d}
.flap-face{position:absolute;inset:0;clip-path:polygon(0 0,100% 0,50% 58%);-webkit-backface-visibility:hidden;backface-visibility:hidden}
.flap-out{background:linear-gradient(180deg,#2a1f12,#17110a 70%)}
.flap-in{transform:rotateY(180deg);background:repeating-linear-gradient(45deg,rgba(214,178,98,.22) 0 1px,transparent 1px 8px),repeating-linear-gradient(-45deg,rgba(214,178,98,.22) 0 1px,transparent 1px 8px),linear-gradient(#2b2113,#18120a)}
.seal{position:absolute;z-index:5;left:50%;top:54%;width:calc(19*var(--u));aspect-ratio:1;transform:translate(-50%,-50%);display:grid;place-items:center;padding:0;border:0;cursor:pointer;border-radius:48% 52% 50% 50%/50% 47% 53% 50%;background:radial-gradient(circle at 34% 30%,#c4404f 0%,#9b1a2e 38%,#6e0d1d 70%,#4a0713 100%);box-shadow:0 calc(.6*var(--u)) calc(1.8*var(--u)) rgba(0,0,0,.55),inset 0 0 0 calc(1.1*var(--u)) rgba(90,8,20,.5),inset 0 calc(-.7*var(--u)) calc(1.4*var(--u)) rgba(0,0,0,.35);animation:sealPulse 2.6s ease-in-out infinite}
.seal::before{content:"";position:absolute;inset:15%;border-radius:50%;border:1px solid rgba(255,214,150,.5)}
.seal::after{content:"";position:absolute;inset:-14%;border-radius:50%;border:1px solid rgba(var(--glow),.6);animation:sealRing 2.6s ease-out infinite}
.seal-mono{font:400 calc(10.5*var(--u))/1 var(--f-script);margin-top:.12em;padding:0 .12em}
@keyframes sealPulse{0%,100%{transform:translate(-50%,-50%) scale(1)}50%{transform:translate(-50%,-50%) scale(1.05)}}
@keyframes sealRing{from{transform:scale(.82);opacity:.95}to{transform:scale(1.4);opacity:0}}

#intro.opening{pointer-events:none}
#intro.opening .seal{animation:sealOff .55s cubic-bezier(.5,0,.75,0) both}
#intro.opening .seal::after{display:none}
@keyframes sealOff{0%{transform:translate(-50%,-50%) scale(1)}35%{transform:translate(-50%,-50%) scale(1.14)}100%{transform:translate(-50%,-50%) scale(.2) rotate(25deg);opacity:0}}
#intro.opening .env-flap{animation:flapOpen .9s cubic-bezier(.45,.05,.3,1) .35s both}
@keyframes flapOpen{0%{transform:rotateX(0deg);z-index:4}49%{z-index:4}51%{z-index:1}100%{transform:rotateX(180deg);z-index:1}}
#intro.opening .env-card{animation:cardUp 1.1s cubic-bezier(.2,.75,.25,1) 1.05s both}
@keyframes cardUp{to{transform:translateY(-62%)}}
#intro.opening .env-float{animation:envOut 1s cubic-bezier(.55,0,.8,.3) 2.1s both}
@keyframes envOut{to{transform:scale(1.5) translateY(14%);opacity:0;filter:blur(6px)}}
#intro.opening .intro-eyebrow,#intro.opening .intro-bottom{animation:fadeOut .5s ease both}

/* ---------- scenes ---------- */
.scenes{position:absolute;inset:0;z-index:4}
.scene{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding-top:var(--hud-top);padding-bottom:var(--hud-bottom);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));visibility:hidden;opacity:0;pointer-events:none}
.scene.on{visibility:visible;opacity:1;transition:opacity .9s ease .15s}
.scene.out{visibility:visible;opacity:0;transition:opacity .75s ease}
.scene.out .fit{filter:blur(6px);transform:scale(calc(var(--fit,1)*1.06));transition:transform .8s ease,filter .8s ease}
.fit{flex:none;display:flex;flex-direction:column;align-items:center;text-align:center;width:min(100%,calc(92*var(--u)));transform:scale(var(--fit,1));transform-origin:50% 50%}
.fitx{white-space:nowrap;font-size:calc(var(--fs) * var(--k,1))}

/* reveal primitives — run while the scene is on (and keep their end state while it fades out) */
.r,.wipe,.w{opacity:0}
.scene:is(.on,.out) .r{animation:rev 1.5s cubic-bezier(.16,.84,.3,1) var(--d,0s) both}
.scene:is(.on,.out) .r.r-zoom{animation-name:revZoom;animation-duration:1.8s}
.scene:is(.on,.out) .r.r-spread{animation-name:revSpread;animation-duration:2s}
@keyframes rev{from{opacity:0;transform:translateY(calc(2.4*var(--u)));filter:blur(8px)}to{opacity:1;transform:none;filter:blur(0)}}
@keyframes revZoom{from{opacity:0;transform:scale(1.25);filter:blur(10px)}to{opacity:1;transform:none;filter:blur(0)}}
@keyframes revSpread{from{opacity:0;letter-spacing:1.1em;filter:blur(6px)}to{opacity:1;filter:blur(0)}}
.wipe{display:block;padding:.1em .45em .22em;margin:-.1em -.45em -.22em;-webkit-mask-image:linear-gradient(90deg,#000 0 50%,transparent 60%);mask-image:linear-gradient(90deg,#000 0 50%,transparent 60%);-webkit-mask-size:250% 100%;mask-size:250% 100%;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;-webkit-mask-position:100% 0;mask-position:100% 0}
.scene:is(.on,.out) .wipe{animation:wipe var(--wd,2.2s) cubic-bezier(.5,.1,.4,1) var(--d,0s) both}
@keyframes wipe{from{opacity:1;-webkit-mask-position:100% 0;mask-position:100% 0}to{opacity:1;-webkit-mask-position:0 0;mask-position:0 0}}
.divider{display:block;width:calc(46*var(--u));max-width:100%;height:auto;aspect-ratio:10/1;overflow:visible}

/* 1 — title */
.s-title .fit{gap:calc(1.2*var(--u))}
.t-jub{--fs:calc(17*var(--u))}
.t-na{font-size:calc(5.6*var(--u));color:var(--champagne);line-height:1}
.t-name{--fs:calc(20*var(--u))}
.s-title .divider{margin-top:calc(1*var(--u))}

/* 2 — the number */
.s-number .fit{gap:calc(2.4*var(--u))}
.age-wrap{position:relative;isolation:isolate;display:grid;place-items:center}
.rays{position:absolute;left:50%;top:50%;z-index:-1;width:calc(150*var(--u));aspect-ratio:1;margin:calc(-75*var(--u)) 0 0 calc(-75*var(--u));border-radius:50%;background:repeating-conic-gradient(from 0deg,rgba(var(--glow),.12) 0deg 2.5deg,transparent 2.5deg 11.25deg);-webkit-mask-image:radial-gradient(circle,#000 6%,transparent 62%);mask-image:radial-gradient(circle,#000 6%,transparent 62%);opacity:0;pointer-events:none}
.scene:is(.on,.out) .rays{animation:raysIn 2.6s ease 1.5s both,spin 70s linear infinite}
@keyframes raysIn{to{opacity:1}}
@keyframes spin{to{rotate:360deg}}
.age-svg{display:block;height:calc(46*var(--u));width:auto;max-width:calc(92*var(--u));overflow:visible;filter:drop-shadow(0 0 calc(2*var(--u)) rgba(var(--glow),.28))}
.age-t{font-family:var(--f-num);font-weight:500;font-size:200px}
.age-stroke{fill:none;stroke:#e6c477;stroke-width:1.4;stroke-dasharray:900;stroke-dashoffset:900}
.age-fill{opacity:0}
.age-sheen{transform-box:fill-box;transform:translateX(0)}
.scene:is(.on,.out) .age-stroke{animation:draw 2.4s cubic-bezier(.6,.1,.4,1) .2s both,strokeDim 1.2s ease 2.5s both}
.scene:is(.on,.out) .age-fill{animation:fillIn 1.3s ease 1.55s both}
.scene:is(.on,.out) .age-sheen{animation:sheenX 3.6s cubic-bezier(.4,0,.2,1) 2.6s infinite}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes strokeDim{to{stroke-opacity:.35}}
@keyframes fillIn{to{opacity:1}}
@keyframes sheenX{0%{transform:translateX(0)}60%,100%{transform:translateX(270%)}}
.age-label{font-size:max(13px,calc(5*var(--u)))}

/* 3 — message */
.panel{position:relative;width:min(100%,calc(86*var(--u)));padding:calc(8*var(--u)) calc(7*var(--u));border:1px solid var(--line);background:linear-gradient(180deg,rgba(18,13,8,.6),rgba(8,6,4,.74));box-shadow:0 calc(2*var(--u)) calc(10*var(--u)) rgba(0,0,0,.45)}
.panel::before{content:"";position:absolute;inset:calc(1.4*var(--u));border:1px solid var(--line-soft);pointer-events:none}
.pc{position:absolute;width:calc(2*var(--u));min-width:7px;aspect-ratio:1;background:var(--gold);transform:translate(-50%,-50%) rotate(45deg)}
.pc.tl{left:0;top:0}.pc.tr{left:100%;top:0}.pc.bl{left:0;top:100%}.pc.br{left:100%;top:100%}
.scene:is(.on,.out) .r-panel{animation:panelIn 1.5s cubic-bezier(.2,.7,.2,1) .15s both}
@keyframes panelIn{from{opacity:0;clip-path:inset(50% -6% 50% -6%)}to{opacity:1;clip-path:inset(-6% -6% -6% -6%)}}
.m-greet{font-size:calc(10*var(--u));margin-bottom:calc(2.6*var(--u))}
.m-text{font:italic 500 max(15px,calc(5.3*var(--u)))/1.5 var(--f-text);color:var(--champagne);text-wrap:pretty}
.m-text .w{display:inline-block}
.m-text .hl{font-weight:600}
.scene:is(.on,.out) .m-text .w{animation:wordIn 1.1s cubic-bezier(.2,.7,.2,1) calc(var(--d0,2s) + var(--i)*.11s) both}
@keyframes wordIn{from{opacity:0;transform:translateY(.35em);filter:blur(4px)}to{opacity:1;transform:none;filter:blur(0)}}

/* 4 — date & place */
.details{gap:calc(4.5*var(--u))}
.d-when,.d-where{display:flex;flex-direction:column;align-items:center;gap:calc(1.6*var(--u));min-width:0}
.ring-wrap{position:relative;width:calc(56*var(--u));aspect-ratio:1;display:grid;place-items:center}
.ring{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.ring-c1{fill:none;stroke:#dcb867;stroke-width:.55;stroke-dasharray:302;stroke-dashoffset:302;transform-box:fill-box;transform-origin:50% 50%;rotate:-90deg}
.ring-c2{fill:none;stroke:rgba(214,178,98,.5);stroke-width:.4;stroke-dasharray:.5 2.4;stroke-linecap:round;transform-box:fill-box;transform-origin:50% 50%;opacity:0}
.scene:is(.on,.out) .ring-c1{animation:draw 2.3s cubic-bezier(.6,.1,.3,1) .6s both}
.scene:is(.on,.out) .ring-c2{animation:fillIn 1.5s ease 2.2s both,spin 80s linear infinite}
.ring-in{position:relative;display:flex;flex-direction:column;align-items:center}
.d-day{font:400 calc(21*var(--u))/1 var(--f-num);padding:0 .06em}
.d-month{margin-top:calc(1.2*var(--u));font:600 calc(4.2*var(--u))/1 var(--f-text);letter-spacing:.36em;padding-left:.36em;text-transform:uppercase;color:var(--champagne)}
.d-year{margin-top:calc(1.4*var(--u));font:italic 500 calc(4.6*var(--u))/1 var(--f-text);color:var(--muted)}
.d-time{font:400 calc(6.6*var(--u))/1.2 var(--f-num);color:var(--champagne)}
.d-time .gold{font-weight:500}
.d-venue{display:inline-flex;align-items:center;gap:.5em;margin-top:calc(1.4*var(--u))}
.d-venue .ico{width:1.35em;height:1.35em;color:var(--gold)}
.d-venue-name{font:italic 400 calc(7.6*var(--u))/1.2 var(--f-num);padding:0 .1em;text-wrap:balance}
.d-addr{max-width:calc(80*var(--u));font:italic 500 max(14px,calc(4.8*var(--u)))/1.35 var(--f-text);color:var(--muted);text-wrap:balance}

/* 5 — RSVP */
.s-rsvp .fit{gap:calc(2*var(--u))}
.flutes{display:block;width:calc(62*var(--u));height:auto;overflow:visible;margin-bottom:calc(2*var(--u))}
.fl-glass{fill:rgba(255,255,255,.06);stroke:rgba(255,248,230,.6);stroke-width:.9}
.fl-wine{fill:url(#g-wine)}
.fl-hi{fill:none;stroke:rgba(255,255,255,.45);stroke-width:1.3;stroke-linecap:round}
.fl-stem{fill:rgba(255,248,230,.5)}
.fl-bub{fill:rgba(255,250,235,.85);opacity:0}
.scene:is(.on,.out) .fl-bub{animation:bub 2.2s ease-in calc(var(--b)*.37s) infinite}
@keyframes bub{0%{opacity:0;transform:translateY(0)}20%{opacity:.9}100%{opacity:0;transform:translateY(-46px)}}
.fl-l,.fl-r{transform-box:view-box;opacity:0}
.fl-l{transform-origin:50px 160px}
.fl-r{transform-origin:150px 160px}
.scene:is(.on,.out) .fl-l{animation:flL 2.4s cubic-bezier(.3,.7,.3,1) .2s both}
.scene:is(.on,.out) .fl-r{animation:flR 2.4s cubic-bezier(.3,.7,.3,1) .2s both}
@keyframes flL{0%{opacity:0;transform:translateX(-40px) rotate(-6deg)}45%{opacity:1;transform:translateX(-6px) rotate(4deg)}58%{transform:translateX(0) rotate(15deg)}70%{transform:translateX(-2px) rotate(11deg)}100%{opacity:1;transform:translateX(0) rotate(13deg)}}
@keyframes flR{0%{opacity:0;transform:translateX(40px) rotate(6deg)}45%{opacity:1;transform:translateX(6px) rotate(-4deg)}58%{transform:translateX(0) rotate(-15deg)}70%{transform:translateX(2px) rotate(-11deg)}100%{opacity:1;transform:translateX(0) rotate(-13deg)}}
.rs-ask{font-size:max(12px,calc(3.6*var(--u)));letter-spacing:.3em;padding-left:.3em;line-height:1.6;text-wrap:balance;max-width:calc(84*var(--u))}
.rs-date{font:italic 400 calc(8.4*var(--u))/1.2 var(--f-num);padding:0 .1em}
.rs-phone{display:flex;flex-direction:column;align-items:center;gap:calc(1*var(--u));margin-top:calc(1*var(--u))}
.rs-phone small{font:italic 500 max(14px,calc(4.4*var(--u)))/1 var(--f-text);color:var(--muted)}
.rs-phone b{font:400 calc(6.4*var(--u))/1.2 var(--f-num);letter-spacing:.04em;color:var(--champagne)}

/* 6 — finale */
.s-finale .fit{gap:calc(2.2*var(--u))}
.f-title{--fs:calc(19*var(--u))}
.f-text{max-width:calc(80*var(--u));font-size:max(16px,calc(5.8*var(--u)));line-height:1.45;color:var(--champagne);text-wrap:balance}
.f-sign{--fs:calc(13*var(--u))}

/* 7 — card */
.s-card{user-select:text;-webkit-user-select:text;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 16px)}
.scene.scroll{overflow-y:auto;align-items:flex-start;overscroll-behavior:contain}
.scene.scroll .fit{transform-origin:50% 0}
#app[data-scene="card"] .s-card.on{pointer-events:auto}
.card{position:relative;width:min(100%,calc(88*var(--u)));padding:calc(7*var(--u)) calc(6*var(--u));gap:calc(3.6*var(--u));border:1px solid var(--line);background:linear-gradient(180deg,rgba(18,13,8,.66),rgba(8,6,4,.8));box-shadow:0 calc(2*var(--u)) calc(10*var(--u)) rgba(0,0,0,.5)}
.card::before{content:"";position:absolute;inset:calc(1.4*var(--u));border:1px solid var(--line-soft);pointer-events:none}
.c-head{display:flex;flex-direction:column;align-items:center;gap:calc(.6*var(--u));min-width:0;width:100%}
.c-name{--fs:calc(15*var(--u))}
.c-age{display:flex;align-items:baseline;gap:.4em;font:500 calc(8*var(--u))/1 var(--f-num)}
.c-age-l{font:600 max(11px,calc(3.2*var(--u)))/1 var(--f-text);letter-spacing:.36em;text-transform:uppercase;color:var(--gold)}
.c-body{display:flex;flex-direction:column;gap:calc(3.4*var(--u));width:100%;min-width:0}
.c-list{list-style:none;padding:0;display:flex;flex-direction:column;gap:calc(2.2*var(--u));width:100%;text-align:left}
.c-list li{display:grid;grid-template-columns:auto minmax(0,1fr);align-items:start;gap:.75em;font:500 clamp(15px,calc(4.4*var(--u)),28px)/1.35 var(--f-text);color:var(--champagne)}
.c-list .ico{margin-top:.12em;width:1.2em;height:1.2em;color:var(--gold)}
.c-list small{display:block;font-size:.88em;font-style:italic;color:var(--muted)}
.c-list b{font-weight:600}
.c-phone{display:flex;align-items:center;gap:.6em;margin-top:.2em;font-weight:600;letter-spacing:.03em}
.copy{display:inline-grid;place-items:center;width:32px;height:32px;flex:none;padding:0;border:1px solid var(--line-soft);border-radius:50%;background:transparent;color:var(--gold);cursor:pointer;transition:border-color .3s ease,color .3s ease}
.copy:hover{border-color:var(--gold);color:var(--gold-hi)}
.copy .ico{width:15px;height:15px;margin:0}
.c-actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;width:100%}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.55em;min-height:44px;padding:10px 12px;border:1px solid var(--line);border-radius:999px;background:rgba(22,16,9,.6);color:var(--champagne);font:600 clamp(12px,calc(3.1*var(--u)),17px)/1.15 var(--f-text);letter-spacing:.08em;text-transform:uppercase;text-decoration:none;text-align:center;cursor:pointer;transition:background .3s ease,border-color .3s ease,color .3s ease,box-shadow .3s ease}
.btn .ico{width:1.3em;height:1.3em;color:var(--gold)}
.btn:hover{border-color:var(--gold);background:rgba(52,38,18,.75);color:var(--gold-hi)}
.btn-primary{grid-column:1 / -1;border-color:transparent;background:linear-gradient(180deg,#f3dc98,#d2ad5b 55%,#b4862f);color:#1d1406;box-shadow:0 0 18px rgba(var(--glow),.25)}
.btn-primary .ico{color:#1d1406}
.btn-primary:hover{background:linear-gradient(180deg,#fbeec4,#dfbb69 55%,#c2943a);color:#1d1406}
.replay{display:inline-flex;align-items:center;gap:.6em;padding:8px 14px;border:0;background:transparent;color:var(--muted);font:italic 500 clamp(15px,calc(4.4*var(--u)),21px)/1 var(--f-text);cursor:pointer}
.replay .ico{width:1.1em;height:1.1em}
.replay:hover{color:var(--gold-hi)}

/* ---------- decor: balloons & laurels ---------- */
.decor{position:absolute;inset:0;z-index:3;pointer-events:none;overflow:hidden}
.bl{position:absolute;bottom:0;left:var(--x);width:calc(var(--s)*var(--u));translate:-50% 115%}
.bl svg{display:block;width:100%;height:auto;transform-origin:50% 6%;animation:bob var(--bob,3.4s) ease-in-out infinite alternate}
@keyframes bob{from{transform:translateY(0) rotate(calc(var(--tilt,0deg) - 3deg))}to{transform:translateY(-4%) rotate(calc(var(--tilt,0deg) + 3deg))}}
.decor.rise .bl{animation:blRise var(--rt,5s) cubic-bezier(.22,.7,.25,1) var(--dl,0s) both}
.decor.away .bl{translate:-50% var(--ry,30%);animation:blAway 4.2s cubic-bezier(.5,0,.75,.4) var(--dl2,0s) both}
.decor.release .bl{animation:blRel var(--rt,9s) cubic-bezier(.35,.1,.65,1) var(--dl,0s) both}
@keyframes blRise{from{translate:-50% 115%}to{translate:-50% var(--ry,30%)}}
@keyframes blAway{to{translate:-50% calc(-100vh - 40%)}}
@keyframes blRel{from{translate:-50% 115%}to{translate:calc(-50% + var(--dx,0px)) calc(-100vh - 130%)}}
.laurels{opacity:0;transition:opacity 1.2s ease}
.laurels.show{opacity:1}
.laurel{position:absolute;bottom:calc(-2*var(--u));width:max(84px,min(calc(30*var(--u)),15vh));height:auto;overflow:visible}
.laurel.lr-l{left:calc(-2*var(--u))}
.laurel.lr-r{right:calc(-2*var(--u));transform:scaleX(-1)}
.laurel .stem{fill:none;stroke:#c9a14e;stroke-width:1.6;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1}
.laurel .leaf{fill:url(#g-leaf);stroke:rgba(255,236,180,.35);stroke-width:.5;transform-box:fill-box;transform-origin:0 50%;scale:0}
.laurels.grow .stem{animation:draw 1.5s ease .1s both}
.laurels.grow .leaf{animation:leafIn .7s cubic-bezier(.3,1.5,.5,1) calc(.35s + var(--i)*80ms) both}
@keyframes leafIn{to{scale:1}}

#app.paused *,#app.paused *::before,#app.paused *::after{animation-play-state:paused!important}

/* ---------- wide screens (landscape phones, tablets, desktops) ---------- */
@media (min-aspect-ratio:5/4){
  .fit{width:min(100%,calc(150*var(--u)))}
  .panel{width:min(100%,calc(124*var(--u)));padding:calc(7*var(--u)) calc(10*var(--u))}
  .details{flex-direction:row;align-items:center;gap:calc(10*var(--u))}
  .d-where{max-width:calc(70*var(--u))}
  .card{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);grid-template-rows:auto auto;align-items:center;column-gap:calc(7*var(--u));row-gap:calc(2*var(--u));width:min(100%,max(calc(150*var(--u)),640px));padding:calc(5.5*var(--u)) calc(8*var(--u))}
  .c-head{grid-column:1;grid-row:1;align-self:end}
  .c-body{grid-column:2;grid-row:1 / span 2}
  .card .replay{grid-column:1;grid-row:2;align-self:start;justify-self:center}
  .c-list{gap:calc(1.6*var(--u))}
}

/* ---------- short screens (landscape phones) ---------- */
@media (max-height:500px){
  :root{--hud-top:calc(env(safe-area-inset-top,0px) + 44px);--hud-bottom:calc(env(safe-area-inset-bottom,0px) + 42px)}
  .ibtn{width:32px;height:32px}
  .skip{padding:6px 10px 6px 14px;bottom:calc(env(safe-area-inset-bottom,0px) + 6px)}
  .btn{min-height:40px;padding:8px 10px}
}

/* ---------- reduced motion ---------- */
@media (prefers-reduced-motion:reduce){
  .scene:is(.on,.out) .r,.scene:is(.on,.out) .r.r-zoom,.scene:is(.on,.out) .r.r-spread,.scene:is(.on,.out) .m-text .w{animation-name:fadeIn;animation-duration:.8s}
  .scene:is(.on,.out) .wipe{animation-duration:.8s}
  .sheen,.bl svg,.seal,.seal::after,.env-float,.rays{animation:none!important}
  .scene:is(.on,.out) .rays{opacity:1}
  .decor.release{display:none}
  .scene.out .fit{filter:none;transform:scale(var(--fit,1))}
}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
</style>
</head>

<script>
/* ===== Canvas effects: gold dust & bokeh (behind), confetti & glints (in front), fireworks ===== */
const FX = (() => {
  const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const app = document.getElementById('app');
  const back = document.getElementById('fx-back'), front = document.getElementById('fx-front');
  const bctx = back.getContext('2d'), fctx = front.getContext('2d');
  const TAU = Math.PI * 2;
  const rand = (a, b) => a + Math.random() * (b - a);
  const pick = a => a[(Math.random() * a.length) | 0];
  let W = 0, H = 0, DPR = 1, S = 1, T = 0, last = performance.now(), frontDirty = false, glow = 1, glowTarget = 1;
  const dust = [], bokeh = [], sparks = [], rockets = [], confetti = [], glints = [], emitters = [];

  function sprite(size, stops) {
    const c = document.createElement('canvas'); c.width = c.height = size;
    const g = c.getContext('2d'), r = size / 2, grd = g.createRadialGradient(r, r, 0, r, r, r);
    stops.forEach(([o, col]) => grd.addColorStop(o, col));
    g.fillStyle = grd; g.fillRect(0, 0, size, size); return c;
  }
  const DOT = sprite(64, [[0, 'rgba(255,250,232,1)'], [.16, 'rgba(255,226,156,.92)'], [.42, 'rgba(232,182,84,.26)'], [1, 'rgba(200,150,60,0)']]);
  const WDOT = sprite(64, [[0, 'rgba(255,255,255,1)'], [.2, 'rgba(255,246,220,.85)'], [.5, 'rgba(255,230,180,.2)'], [1, 'rgba(255,230,180,0)']]);
  const BOKEH = sprite(128, [[0, 'rgba(255,214,140,.5)'], [.62, 'rgba(255,206,120,.3)'], [.86, 'rgba(255,218,150,.42)'], [1, 'rgba(255,210,130,0)']]);
  const STAR = (() => {
    const s = 96, c = document.createElement('canvas'); c.width = c.height = s;
    const g = c.getContext('2d'); g.translate(s / 2, s / 2);
    const rg = g.createRadialGradient(0, 0, 0, 0, 0, s / 2);
    rg.addColorStop(0, 'rgba(255,252,238,1)'); rg.addColorStop(.1, 'rgba(255,232,170,.85)');
    rg.addColorStop(.32, 'rgba(255,200,100,.16)'); rg.addColorStop(1, 'rgba(255,200,100,0)');
    g.fillStyle = rg; g.fillRect(-s / 2, -s / 2, s, s);
    g.globalCompositeOperation = 'lighter';
    for (const a of [0, Math.PI / 2]) {
      g.save(); g.rotate(a);
      const lg = g.createLinearGradient(-s / 2, 0, s / 2, 0);
      lg.addColorStop(0, 'rgba(255,240,200,0)'); lg.addColorStop(.5, 'rgba(255,252,240,1)'); lg.addColorStop(1, 'rgba(255,240,200,0)');
      g.fillStyle = lg; g.beginPath(); g.moveTo(-s / 2, 0);
      g.quadraticCurveTo(0, -s * .03, s / 2, 0); g.quadraticCurveTo(0, s * .03, -s / 2, 0); g.fill(); g.restore();
    }
    return c;
  })();
  const CONF = [['#f8e3a1', '#b8892e'], ['#e6bd5c', '#8f6720'], ['#fff6dc', '#cdbb93'], ['#d4a445', '#7a5518'], ['#f3d27e', '#a57a28'], ['#ffffff', '#bdb3a0']];

  function newDust(anywhere) {
    return { x: Math.random() * W, y: anywhere ? Math.random() * H : H + 8, r: rand(.5, 2.3), vy: -rand(5, 19), vx: rand(-4, 4), ph: rand(0, TAU), sp: rand(.7, 2.4), a: rand(.25, .95) };
  }
  function newBokeh() {
    return { x: Math.random() * W, y: Math.random() * H, r: rand(28, 110) * S, vx: rand(-6, 6), vy: rand(-8, -2), a: rand(.035, .1), ph: rand(0, TAU) };
  }
  function resize() {
    const w = app.clientWidth || innerWidth, h = app.clientHeight || innerHeight;
    if (!w || !h) return;
    const sx = W ? w / W : 1, sy = H ? h / H : 1;
    W = w; H = h; DPR = Math.min(window.devicePixelRatio || 1, 2);
    S = Math.max(.55, Math.min(1.6, Math.min(W, H) / 700));
    for (const c of [back, front]) { c.width = Math.round(W * DPR); c.height = Math.round(H * DPR); }
    bctx.setTransform(DPR, 0, 0, DPR, 0, 0); fctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    for (const p of dust) { p.x *= sx; p.y *= sy; }
    for (const p of bokeh) { p.x *= sx; p.y *= sy; }
    const nd = Math.round(Math.max(50, Math.min(230, W * H / 6500)) * (RM ? .4 : 1));
    while (dust.length < nd) dust.push(newDust(true)); dust.length = nd;
    const nb = Math.round(Math.max(6, Math.min(16, W * H / 80000)));
    while (bokeh.length < nb) bokeh.push(newBokeh()); bokeh.length = nb;
    frontDirty = true;
  }

  /* ---- spawners ---- */
  function glint(x, y, size, life) { glints.push({ x, y, s: size, life, t: 0, rot: rand(-.4, .4) }); }
  function glintBurst(x, y, n = 10, spread = 60) {
    for (let i = 0; i < n; i++) glint(x + rand(-spread, spread) * S, y + rand(-spread, spread) * .6 * S, rand(16, 46) * S, rand(.5, 1.2));
    glint(x, y, 90 * S, .9);
  }
  function burst(x, y, n = 120, power = 1) {
    if (RM) n = Math.round(n / 4);
    for (let i = 0; i < n; i++) {
      const a = rand(0, TAU), v = rand(.25, 1) * 620 * power * S;
      confetti.push(piece(x, y, Math.cos(a) * v, Math.sin(a) * v * .75 - 260 * power * S));
    }
  }
  function piece(x, y, vx, vy) {
    const c = pick(CONF);
    return { x, y, vx, vy, w: rand(5, 9) * S, h: rand(9, 15) * S, rot: rand(0, TAU), vr: rand(-7, 7), fl: rand(0, TAU), vf: rand(5, 11), c, t: 0, life: rand(3.6, 5.6), round: Math.random() < .22 };
  }
  function launch(x, y) { rockets.push({ x0: x + rand(-60, 60) * S, x, y0: H + 10, y, t: 0, dur: rand(.85, 1.25), px: x, py: H + 10 }); }
  function explode(x, y) {
    const n = RM ? 28 : (rand(70, 105) | 0), sp = rand(170, 260) * S, white = Math.random() < .35;
    for (let i = 0; i < n; i++) {
      const a = (i / n) * TAU + rand(-.06, .06), v = sp * rand(.45, 1);
      sparks.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, t: 0, life: rand(1.3, 2.3), s: rand(1.4, 2.6) * S, w: white && Math.random() < .7 });
    }
    glint(x, y, 120 * S, .7);
  }

  /* ---- emitters (time-boxed, cleared on scene change) ---- */
  function emitter(fn, duration) { const e = { fn, t: 0, acc: 0, duration }; emitters.push(e); return e; }
  function stopEmitters() { emitters.length = 0; }
  function glintsIn(el, rate, duration) {
    if (!el) return;
    emitter((dt, e) => {
      e.acc += dt * rate * (RM ? .4 : 1);
      while (e.acc >= 1) {
        e.acc--; const r = el.getBoundingClientRect();
        if (r.width) glint(r.left + Math.random() * r.width, r.top + r.height * rand(.15, .85), rand(14, 36) * S, rand(.7, 1.3));
      }
    }, duration);
  }
  function ring(el, drawDur, duration) {
    if (!el) return;
    emitter((dt, e) => {
      const r = el.getBoundingClientRect(); if (!r.width) return;
      const cx = r.left + r.width / 2, cy = r.top + r.height / 2, R = r.width * .48;
      if (e.t < drawDur + .4) {
        const p = Math.min(1, Math.max(0, (e.t - .6) / drawDur));
        const ease = p < .5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2;
        const a = -Math.PI / 2 + ease * TAU;
        if (p > 0 && p < 1) {
          e.acc += dt * 34;
          while (e.acc >= 1) { e.acc--; glint(cx + Math.cos(a) * R + rand(-3, 3), cy + Math.sin(a) * R + rand(-3, 3), rand(14, 34) * S, rand(.45, .9)); }
        }
      } else {
        e.acc += dt * 5;
        while (e.acc >= 1) { e.acc--; const a = rand(0, TAU); glint(cx + Math.cos(a) * R, cy + Math.sin(a) * R, rand(14, 30) * S, rand(.7, 1.2)); }
      }
    }, duration);
  }
  function fireworks(duration) {
    if (RM) return;
    let next = 0;
    emitter((dt, e) => { if (e.t >= next) { next = e.t + rand(.45, .85); launch(rand(.14, .86) * W, rand(.1, .38) * H); } }, duration);
  }
  function rain(duration, rate = 40) {
    if (RM) return;
    emitter((dt, e) => {
      e.acc += dt * rate * Math.min(1.6, W / 600);
      while (e.acc >= 1) { e.acc--; confetti.push(piece(rand(0, W), -20, rand(-30, 30), rand(30, 120) * S)); }
    }, duration);
  }

  /* ---- loop ---- */
  function update(dt) {
    T += dt;
    glow += (glowTarget - glow) * Math.min(1, dt * 1.5);
    for (const p of dust) {
      p.y += p.vy * dt * (RM ? .4 : 1); p.x += (p.vx + Math.sin(T * .5 + p.ph) * 6) * dt;
      if (p.y < -12 || p.x < -12 || p.x > W + 12) Object.assign(p, newDust(false));
    }
    for (const b of bokeh) {
      b.x += b.vx * dt; b.y += b.vy * dt;
      if (b.y < -b.r) { b.y = H + b.r; b.x = Math.random() * W; }
      if (b.x < -b.r) b.x = W + b.r; else if (b.x > W + b.r) b.x = -b.r;
    }
    for (let i = emitters.length - 1; i >= 0; i--) { const e = emitters[i]; e.t += dt; e.fn(dt, e); if (e.t >= e.duration) emitters.splice(i, 1); }
    for (let i = rockets.length - 1; i >= 0; i--) {
      const r = rockets[i]; r.t += dt; const p = Math.min(1, r.t / r.dur), k = 1 - Math.pow(1 - p, 2.2);
      r.px = r.x0 + (r.x - r.x0) * k; r.py = r.y0 + (r.y - r.y0) * k;
      if (p >= 1) { explode(r.x, r.y); rockets.splice(i, 1); }
    }
    const drag = Math.exp(-1.7 * dt);
    for (let i = sparks.length - 1; i >= 0; i--) {
      const s = sparks[i]; s.t += dt;
      if (s.t >= s.life) { sparks.splice(i, 1); continue; }
      s.vx *= drag; s.vy = s.vy * drag + 75 * S * dt; s.x += s.vx * dt; s.y += s.vy * dt;
    }
    const cdrag = Math.exp(-1.9 * dt);
    for (let i = confetti.length - 1; i >= 0; i--) {
      const c = confetti[i]; c.t += dt;
      if (c.t >= c.life || c.y > H + 40) { confetti.splice(i, 1); continue; }
      c.vx *= cdrag; c.vy = c.vy * cdrag + 240 * S * dt;
      c.x += (c.vx + Math.sin(c.t * 3 + c.fl) * 26 * S) * dt; c.y += c.vy * dt;
      c.rot += c.vr * dt; c.fl += c.vf * dt;
    }
    for (let i = glints.length - 1; i >= 0; i--) { const g = glints[i]; g.t += dt; if (g.t >= g.life) glints.splice(i, 1); }
  }

  function drawBack() {
    const g = bctx; g.clearRect(0, 0, W, H); g.globalCompositeOperation = 'lighter';
    for (const b of bokeh) {
      g.globalAlpha = b.a * (.7 + .3 * Math.sin(T * .4 + b.ph)) * glow;
      g.drawImage(BOKEH, b.x - b.r, b.y - b.r, b.r * 2, b.r * 2);
    }

    el.style.removeProperty('--k');
    const cs = getComputedStyle(el);
    const need = el.offsetWidth + parseFloat(cs.marginLeft) + parseFloat(cs.marginRight);
    const avail = el.parentElement.clientWidth;
    if (avail && need > avail) el.style.setProperty('--k', Math.max(.3, avail / need * .97).toFixed(3));
  }
  function fitScene(sc) {
    const fit = $('.fit', sc); if (!fit) return;
    fit.style.setProperty('--fit', 1);
    $$('.fitx', sc).forEach(fitText);
    const cs = getComputedStyle(sc);
    const aw = sc.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
    const ah = sc.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
    let k = Math.min(1, aw / fit.offsetWidth, ah / fit.offsetHeight);
    if (!(k > 0 && isFinite(k))) k = 1;
    const minK = sc.classList.contains('s-card') ? .8 : 0;
    sc.classList.toggle('scroll', k < minK);
    fit.style.setProperty('--fit', Math.max(k, minK).toFixed(4));
  }

  /* ---------- player ---------- */
  const scenes = $$('.scene'), CARD = scenes.length - 1;
  const barsEl = $('.bars');
  for (let i = 0; i < CARD; i++) barsEl.insertAdjacentHTML('beforeend', '<span class="bar"><i></i></span>');
  const barEls = $$('.bar i', barsEl);
  const dur = i => parseFloat(scenes[i].dataset.dur) || 8;
  const BA = $('.balloons-a'), BB = $('.balloons-b'), LA = $('.laurels');
  let cur = -1, el = 0, cueI = 0, playing = false, last = performance.now();
  const outT = new Map();

  const setCls = (node, cls) => { node.classList.remove('rise', 'away', 'release'); if (cls) { void node.offsetWidth; node.classList.add(cls); } };
  const laurels = on => { if (on) LA.classList.add('show', 'grow'); else LA.classList.remove('show'); };
  function decor(s) {
    if (s === 'title') { setCls(BA, 'rise'); setCls(BB, null); laurels(false); }
    else if (s === 'number') { setCls(BA, BA.classList.contains('rise') ? 'away' : null); setCls(BB, null); laurels(false); }
    else if (s === 'finale') { setCls(BA, null); setCls(BB, 'release'); laurels(false); }
    else { setCls(BA, null); setCls(BB, null); laurels(true); }
  }
  const center = (node, fy = .5) => { const r = node.getBoundingClientRect(); return [r.left + r.width / 2, r.top + r.height * fy]; };
  const CUES = {
    title: [[0, () => { decor('title'); FX.setGlow(1); }], [.1, () => Music.chime()], [3.4, () => FX.glintsIn($('.t-name > span'), 3.5, 5)]],
    number: [[0, () => decor('number')], [1.75, () => { const [x, y] = center($('#age'), .45); FX.burst(x, y, 150, 1); FX.setGlow(1.5); Music.shimmer(); }],
             [2.6, () => FX.glintsIn($('#age'), 4, 5)], [5, () => FX.setGlow(1)]],
    message: [[0, () => decor('message')]],
    details: [[0, () => { decor('details'); FX.ring($('.ring'), 2.3, 10.5); }]],
    rsvp: [[0, () => decor('rsvp')], [1.6, () => { const r = $('.flutes').getBoundingClientRect(); FX.glintBurst(r.left + r.width * .5, r.top + r.height * .1, 9, 26); Music.clink(); }]],
    finale: [[0, () => decor('finale')], [.1, () => Music.chime()], [.5, () => FX.fireworks(8.5)], [2.2, () => FX.rain(3.5, 34)], [4.8, () => FX.glintsIn($('.f-sign > span'), 2.5, 4)]],
    card: [[0, () => { decor('card'); Music.fadeOut(4.5); wake(false); }], [.9, () => FX.glintsIn($('.c-name > span'), 1.6, 3)]]
  };

  function goTo(i) {
    i = Math.max(0, Math.min(CARD, i));
    const prev = scenes[cur], sc = scenes[i];
    if (prev && prev !== sc) {
      prev.classList.remove('on'); prev.classList.add('out'); prev.setAttribute('aria-hidden', 'true');
      clearTimeout(outT.get(prev)); outT.set(prev, setTimeout(() => prev.classList.remove('out'), 900));
    }
    clearTimeout(outT.get(sc));
    sc.classList.remove('on', 'out'); void sc.offsetWidth;
    fitScene(sc);
    sc.classList.add('on'); sc.setAttribute('aria-hidden', 'false');
    cur = i; el = 0; cueI = 0;
    app.dataset.scene = sc.dataset.id;
    FX.stopEmitters();
    runCues(); drawBars();
  }
  function runCues() {
    const list = CUES[scenes[cur].dataset.id] || [];
    while (cueI < list.length && list[cueI][0] <= el) { try { list[cueI][1](); } catch (e) { console.warn(e); } cueI++; }
  }
  function drawBars() { barEls.forEach((b, k) => b.style.setProperty('--p', k < cur ? 1 : k === cur ? Math.min(1, el / dur(k)).toFixed(4) : 0)); }
  function tick(now) {
    const dt = Math.min(.1, Math.max(0, (now - last) / 1000)); last = now;
    if (playing && cur >= 0 && !document.hidden) {
      el += dt; runCues();
      if (cur < CARD && el >= dur(cur)) goTo(cur + 1);
      drawBars();
    }
    requestAnimationFrame(tick);
  }
  const next = () => { if (cur < CARD) goTo(cur + 1); };
  const prev = () => { if (cur >= 0) goTo(el > 1.5 || cur === 0 ? cur : cur - 1); };
  function replay() { LA.classList.remove('show', 'grow'); Music.start(); wake(true); playing = true; goTo(0); }

  /* ---------- intro ---------- */
  let opened = false;
  const later = (fn, ms) => setTimeout(fn, ms);
  function openInvite() {
    if (opened) return; opened = true;
    Music.init(); Music.seal();
    const [sx, sy] = center($('#seal'));
    FX.glintBurst(sx, sy, 12, 40); FX.burst(sx, sy, 40, .5);
    $('#intro').classList.add('opening');
    wake(true);
    later(() => Music.whoosh(), 380);
    later(() => Music.start(), 700);
    later(() => app.classList.add('flashing'), 2150);
    later(() => { app.classList.remove('is-intro'); playing = true; goTo(0); }, 2600);
    later(() => { $('#intro').hidden = true; app.classList.remove('flashing'); }, 3500);
  }
  $('#seal').addEventListener('click', e => { e.stopPropagation(); openInvite(); });
  $('#env').addEventListener('click', openInvite);

  /* ---------- controls ---------- */
  const bSound = $('#b-sound');
  function showSound(m) { bSound.classList.toggle('muted', m); bSound.setAttribute('aria-pressed', String(!m)); bSound.setAttribute('aria-label', m ? 'Включи звука' : 'Изключи звука'); }
  function toggleSound() { const m = !Music.muted; Music.setMuted(m); showSound(m); try { localStorage.setItem('invite-muted', m ? '1' : '0'); } catch (e) {} }
  try { if (localStorage.getItem('invite-muted') === '1') { Music.setMuted(true); showSound(true); } } catch (e) {}
  bSound.addEventListener('click', toggleSound);
  const bFull = $('#b-full');
  if (document.fullscreenEnabled && root.requestFullscreen) {
    bFull.hidden = false;
    bFull.addEventListener('click', () => { const p = document.fullscreenElement ? document.exitFullscreen() : root.requestFullscreen(); if (p && p.catch) p.catch(() => {}); });
  }
  $('.tz-next').addEventListener('click', next);
  $('.tz-prev').addEventListener('click', prev);
  $('#b-skip').addEventListener('click', () => goTo(CARD));
  $('#a-replay').addEventListener('click', replay);
  document.addEventListener('keydown', e => {
    if (e.altKey || e.ctrlKey || e.metaKey) return;
    if (!opened) { if ((e.key === 'Enter' || e.key === ' ') && !(e.target.closest && e.target.closest('button,a'))) { e.preventDefault(); openInvite(); } return; }
    if (app.classList.contains('is-intro')) return;
    const onControl = e.target.closest && e.target.closest('a,button');
    if ((e.key === 'Enter' || e.key === ' ') && onControl) return;
    if (e.key === 'ArrowRight' || e.key === 'PageDown' || e.key === ' ') { e.preventDefault(); next(); }
    else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); prev(); }
    else if (e.key === 'End' || e.key === 'Escape') goTo(CARD);
    else if (e.key === 'Home') replay();
    else if (/^[mм]$/i.test(e.key)) toggleSound();
  });

  let lock = null;
  async function wake(on) {
    try {
      if (on) { if (!lock && navigator.wakeLock && !document.hidden) { lock = await navigator.wakeLock.request('screen'); lock.addEventListener('release', () => { lock = null; }); } }
      else if (lock) { const l = lock; lock = null; await l.release(); }
    } catch (e) { lock = null; }
  }
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) { app.classList.add('paused'); Music.suspend(); }
    else { app.classList.remove('paused'); Music.resume(); last = performance.now(); if (playing && cur < CARD) wake(true); }
  });

  /* ---------- card actions ---------- */
  let toastT;
  function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2400); }
  const digits = String(C.phone || '').replace(/[^\d+]/g, '');
  if (digits) $('#a-call').href = 'tel:' + digits; else { $('#a-call').hidden = true; $('#a-copy').hidden = true; }
  const place = [D.venueLine, C.address].filter(Boolean).join(', ');
  $('#a-map').href = 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(C.mapQuery || place);
  const p2 = n => String(n).padStart(2, '0');
  const [hh, mi] = String(C.time).split(':').map(n => parseInt(n, 10) || 0);
  const t0 = new Date(ev.getFullYear(), ev.getMonth(), ev.getDate(), hh, mi), t1 = new Date(t0.getTime() + (+C.hours || 6) * 36e5);
  const gc = d => `${d.getFullYear()}${p2(d.getMonth() + 1)}${p2(d.getDate())}T${p2(d.getHours())}${p2(d.getMinutes())}00`;
  $('#a-cal').href = 'https://calendar.google.com/calendar/render?action=TEMPLATE'
    + '&text=' + encodeURIComponent(`Юбилей на ${name} (${age} години)`)
    + '&dates=' + gc(t0) + '/' + gc(t1) + '&ctz=' + encodeURIComponent(C.timeZone || 'Europe/Sofia')
    + '&location=' + encodeURIComponent(place)
    + '&details=' + encodeURIComponent(rs && C.phone ? `Потвърдете присъствие до ${D.rsvpLong} на тел. ${C.phone}` : '');
  $('#a-copy').addEventListener('click', () => {
    const fail = () => {
      const r = document.createRange(); r.selectNodeContents($('#c-phone'));
      const s = getSelection(); s.removeAllRanges(); s.addRange(r); toast('Номерът е маркиран, копирайте го');
    };
    try { navigator.clipboard.writeText(String(C.phone)).then(() => toast('Номерът е копиран'), fail); } catch (e) { fail(); }
  });

  /* ---------- boot ---------- */
  function relayout() { FX.resize(); if (cur >= 0) fitScene(scenes[cur]); }
  let rT;
  const onResize = () => { clearTimeout(rT); rT = setTimeout(relayout, 120); };
  addEventListener('resize', onResize);
  if (window.visualViewport) visualViewport.addEventListener('resize', onResize);
  buildAge();
  const fontsReady = () => { buildAge(); if (cur >= 0) fitScene(scenes[cur]); };
  if (document.fonts && document.fonts.load) {
    Promise.all(['400 64px "Great Vibes"', '500 64px "Playfair Display"', 'italic 400 64px "Playfair Display"', '500 32px "Cormorant Garamond"', '600 32px "Cormorant Garamond"', 'italic 500 32px "Cormorant Garamond"']
      .map(f => document.fonts.load(f, 'Юбилей 0123456789').catch(() => {}))).then(fontsReady);
    document.fonts.ready.then(fontsReady);
  }
  FX.start();
  requestAnimationFrame(tick);
  window.Invitation = { goTo, next, prev, replay, open: openInvite, scenes: scenes.map(s => s.dataset.id) };
})();
</script>
</body>
</html>
